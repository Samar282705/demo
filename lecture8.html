<html lang="en">
<head>

    <title>Document</title>
    <style>
        .container{
            height: 1000px;
            border: 5px solid red;
        }
        .items{

            width: 100%;

            background-color: aquamarine;
        }
        .box2{
            background-color: brown;
            /* opacity: 0.5;    */

        }
        button{

            width: 150px;

            border-radius: 4px;

            cursor: pointer;
        }
        button:hover{
            background-color: rgb(88, 21, 21);
        }
        

    </style>
</head>
<body>
    <div class="container">
        <div class="items box1"></div>
